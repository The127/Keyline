        with an authorization code.
      parameters:
      - default: keyline
        description: Virtual server name
        in: path
        name: virtualServerName
        required: true
        type: string
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Application (client) ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Registered redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Space-delimited scopes (must include 'openid')
        in: query
        name: scope
        required: true
        type: string
      - description: Opaque value returned to client
        in: query
        name: state
        type: string
      - description: e.g. 'query'
        in: query
        name: response_mode
        type: string
      - description: PKCE code challenge
        in: query
        name: code_challenge
        type: string
      - description: S256 or plain
        enum:
        - S256
        - plain
        in: query
        name: code_challenge_method
        type: string
      produces:
      - text/plain
      responses:
        "302":
          description: Redirect to redirect_uri with code (& state)
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Authorize
      tags:
      - OIDC
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Starts the Authorization Code flow. If the user is not authenticated,
        redirects to your login UI; otherwise redirects to the application's redirect_uri
        with an authorization code.
      parameters:
      - default: keyline
        description: Virtual server name
        in: path
        name: virtualServerName
        required: true
        type: string
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Application (client) ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Registered redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Space-delimited scopes (must include 'openid')
        in: query
        name: scope
        required: true
        type: string
      - description: Opaque value returned to client
        in: query
        name: state
        type: string
      - description: e.g. 'query'
        in: query
        name: response_mode
        type: string
      - description: PKCE code challenge
        in: query
        name: code_challenge
        type: string
      - description: S256 or plain
        enum:
        - S256
        - plain
        in: query
        name: code_challenge_method
        type: string
      produces:
      - text/plain
      responses:
        "302":
          description: Redirect to redirect_uri with code (& state)
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Authorize
      tags:
      - OIDC
  /oidc/{virtualServerName}/end_session:
    get:
      parameters:
      - default: keyline
        description: Virtual server name
        in: path
        name: virtualServerName
        required: true
        type: string
      - description: ID token hint of the current session
        in: query
        name: id_token_hint
        required: true
        type: string
      - description: Where to redirect after logout (must be registered)
        in: query
        name: post_logout_redirect_uri
        type: string
      - description: Opaque value returned to client
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to post_logout_redirect_uri
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
      summary: End session
      tags:
      - OIDC
  /oidc/{virtualServerName}/identity-providers/{name}/callback:
    get:
      parameters:
      - default: keyline
        description: Virtual server name
        in: path
        name: virtualServerName
        required: true
        type: string
      - description: Identity provider name
        in: path
        name: name
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: State from the start
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the login page
          schema:
            type: string
        "400":
          description: Unknown state
          schema:
            type: string
      summary: Identity provider callback
      tags:
      - OIDC
  /oidc/{virtualServerName}/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: authorization_code | refresh_token | urn:ietf:params:oauth:grant-type:jwt-bearer
          | urn:ietf:params:oauth:grant-type:device_code
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Required when grant_type=authorization_code
        in: formData
        name: code
        type: string
      - description: Required when grant_type=refresh_token
        in: formData
        name: refresh_token
        type: string
      - description: Required when grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer,
          the service user's signed JWT
        in: formData
        name: assertion
        type: string
      - description: Required when grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer,
          must include openid
        in: formData
        name: scope
        type: string
      - description: If no Authorization header
        in: formData
        name: client_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: When grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer
          schema:
            $ref: '#/definitions/handlers.ServiceUserTokenResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Token endpoint
      tags:
      - OIDC
  /oidc/{virtualServerName}/userinfo:
    post:
      parameters:
      - default: keyline
        description: Virtual server name
        in: path
        name: virtualServerName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OidcUserInfoResponseDto'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Userinfo
      tags:
      - OIDC
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
